name: Daily Donchian Trading Bot Sync

on:
  schedule:
    # Trigger throughout Indian market hours Monday-Friday (IST = UTC + 5:30):
    # 03:45 UTC = 09:15 AM IST (Market Open initialization)
    # 05:30 UTC = 11:00 AM IST (Mid-morning scan)
    # 07:30 UTC = 01:00 PM IST (Mid-day scan)
    # 09:45 UTC = 03:15 PM IST (Market EOD 15:15 Rebalance Window)
    # 10:05 UTC = 03:35 PM IST (Market Close Final Sync)
    - cron: '15 3 * * 1-5'
    - cron: '30 5 * * 1-5'
    - cron: '30 7 * * 1-5'
    - cron: '15 9 * * 1-5'
    - cron: '35 9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: donchian-market-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-donchian:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update Market Data
        run: |
          python update_daily_datasets.py || true

      - name: Run Daily Rebalance
        run: |
          python trading_bot.py --rebalance-now

      - name: Commit and Push Updates
        run: |
          git add README.md portfolio_state.json trade_log.csv Daily/
          if git diff --cached --quiet; then
            echo "No portfolio changes to commit."
          else
            git commit -m "Auto-update Donchian portfolio and dashboard [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          fi

      - name: Publish Action Summary
        if: always()
        run: |
          if [ -f README.md ]; then
            cat README.md >> $GITHUB_STEP_SUMMARY
          fi
